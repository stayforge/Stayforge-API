          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInput'
      responses:
        '201':
          description: Device created successfully
          headers:
            Location:
              description: URL of the created device
              schema:
                type: string
                example: /v1/devices/org_xxxxxxxxxx/ten_xxxxxxxxxx/dev_xxxxxxxxxx
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
