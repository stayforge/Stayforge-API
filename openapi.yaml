          description: 'Bad request - Invalid path parameter format, request body,
            validation error, or tenant not found.

            Error codes: `invalid_request`, `invalid_path_parameter`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_path_parameter:
                  value:
                    code: invalid_path_parameter
                    message: organization_id must match pattern ^org_[a-zA-Z0-9_-]+$
