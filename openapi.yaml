components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'API Key authentication using X-API-Key header.

        API keys must be prefixed with `sk_live_`.

        All API keys are organization-level only.

        Include the API key in the X-API-Key header as: `X-API-Key: <api_key>`

        Get your API key from the [dash.stayforge.io/settings/apikeys](https://dash.stayforge.io/settings/apikeys).

        '
    UserAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'User''s Access Token authentication using Bearer token.

        Include the token in the Authorization header as: `Authorization: Bearer <token>`

        This authentication method is used for API Key management endpoints.

        Users must have admin or owner role in the organization to manage API keys.

        '
  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Human-readable error message describing what went wrong
          example: 'API key not found: b9d0e02cb283477aa6e174053934b0e4'
        code:
          type: string
          description: 'Machine-readable error code for programmatic error handling.

            Common error codes:

            - `authentication_required`: Missing or invalid authentication token (401)

            - `insufficient_permissions`: User lacks required permissions (403)

            - `organization_id_mismatch`: Organization ID in path does not match API
            key organization (403)

            - `not_found`: Requested resource not found (404)

            - `invalid_request`: Request body validation failed (400)

            - `invalid_pagination`: Pagination parameters are invalid (400)

            - `create_error`: Failed to create resource (500)

            - `update_error`: Failed to update resource (500)

            - `delete_error`: Failed to delete resource (500)

            - `list_error`: Failed to list resources (500)

            - `service_error`: Internal service error (500)

            '
          example: not_found
        details:
          type: object
          description: Additional error details (optional, structure varies by error
            type)
          additionalProperties: true
    MemberRoleEnum:
      type: string
      enum:
      - read
      - read/write
      - admin
      - owner
      description: Available roles for resource members (organizations and tenants)
    Organization:
      $ref: '#/components/schemas/OrganizationDetail'
    OrganizationSummary:
      type: object
      required:
      - organization_id
      - name
      - domain
      properties:
        organization_id:
          type: string
          readOnly: true
          description: Organization ID
          example: org_xxxxxxxxxx
        name:
          type: string
          minLength: 4
          maxLength: 64
          description: Name of the organization.
          example: Psychologist, forensic Hotel
        domain:
          type: string
          minLength: 18
          maxLength: 78
          pattern: ^[a-z0-9]{4,64}\.stayforge\.app$
          description: 'Domain of the organization.

            Domain prefix must be 4-64 characters, containing only lowercase letters
            and numbers.

            '
          example: myorg123.stayforge.app
        archive_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Archive timestamp. If null, the organization is active.
        member_count:
          type: integer
          nullable: true
          description: Total number of members (optional, may not be included in all
            list views)
          example: 5
        active_apikey_count:
          type: integer
          nullable: true
          description: Number of active API keys (optional, may not be included in
            all list views)
          example: 3
    OrganizationDetail:
      allOf:
      - $ref: '#/components/schemas/OrganizationSummary'
      - type: object
        properties:
          description:
            type: string
            maxLength: 1024
            nullable: true
            description: Description of the organization
          custom_domain:
            type: string
            nullable: true
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$
            format: hostname
            description: Custom domain of the organization
          billing_address:
            $ref: '#/components/schemas/BillingAddress'
            nullable: true
          billing_account_id:
            type: string
            nullable: true
            readOnly: true
          metadata:
            $ref: '#/components/schemas/Metadata'
          memberships:
            type: array
            items:
              $ref: '#/components/schemas/OrganizationMembership'
            maxItems: 100
          apikey:
            type: array
            items:
              $ref: '#/components/schemas/APIKeyInDB'
            maxItems: 50
          billing_info:
            type: object
            additionalProperties:
              type: string
            nullable: true
    OrganizationInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 64
          description: Name of the organization.
          example: Psychologist, forensic Hotel
        description:
          type: string
          maxLength: 1024
          nullable: true
          description: Description of the organization
          example: Source common easy none which study north Democrat as when agent
            hundred stay.
        custom_domain:
          type: string
          nullable: true
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$
          format: hostname
          description: Custom domain of the organization
          example: your-domain.com
        billing_address:
          $ref: '#/components/schemas/BillingAddress'
          nullable: true
          description: Billing address of the organization
          example:
            line1: 6530 Mcclain Crescent Apt. 135
            line2: Apt. 338
            city: East Isaac
            state: Tennessee
            postal_code: '94141'
            country: US
            phone: 311-747-0060x45985
            email: davidthompson@example.com
        domain:
          type: string
          minLength: 18
          maxLength: 78
          pattern: ^[a-z0-9]{4,64}\.stayforge\.app$
          nullable: true
          description: 'Domain of the organization. If not provided, will be auto-generated
            based on organization_id.

            Domain prefix must be 4-64 characters, containing only lowercase letters
            and numbers.

            '
          example: myorg123.stayforge.app
    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 64
          description: Name of the organization.
          example: Psychologist, forensic Hotel
        description:
          type: string
          maxLength: 1024
          nullable: true
          description: Description of the organization
          example: Source common easy none which study north Democrat as when agent
            hundred stay.
        custom_domain:
          type: string
          nullable: true
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$
          format: hostname
          description: Custom domain of the organization
          example: your-domain.com
        billing_address:
          $ref: '#/components/schemas/BillingAddress'
          nullable: true
          description: Billing address of the organization
          example:
