    InviteCode:
      type: object
      required:
      - id
      - code
      - scope_type
      - scope_id
      - target_role
      - max_uses
      - current_uses
      - is_active
      - created_by
      - created_at
      - status
      properties:
        id:
          type: string
          description: 'Unique identifier for the invitation (format: inv_xxxxxxxxxx)'
          example: inv_abc123xyz
          readOnly: true
        code:
          type: string
          minLength: 9
          maxLength: 9
          pattern: ^[A-Z0-9]{4}-[A-Z0-9]{4}$
          description: Unique random invitation code
          example: GX82-K9LP
          readOnly: true
        scope_type:
          allOf:
          - $ref: '#/components/schemas/InviteScopeTypeEnum'
          description: Type of scope this invitation applies to (currently only ORGANIZATION)
          example: ORGANIZATION
        scope_id:
          type: string
          description: ID of the scope (organization_id or tenant_id)
          example: org_xxxxxxxxxx
        target_role:
          allOf:
          - $ref: '#/components/schemas/InviteRoleEnum'
          description: Role assigned to users who accept this invitation
          example: read/write
        max_uses:
          type: integer
          minimum: 0
          description: Maximum number of times this code can be used (0 = unlimited)
          example: 10
        current_uses:
          type: integer
          minimum: 0
          description: Number of times this code has been used
          example: 3
          readOnly: true
        is_active:
          type: boolean
          description: Whether the invitation code is active and can be used
          default: true
          example: true
        created_by:
          type: string
          description: User sub of the creator (from UserAccessToken or API Key's
            user_sub)
          example: auth0|xxxxxxxxxxxxxxx
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiration timestamp (null = never expires)
          example: '2026-02-01T00:00:00Z'
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          readOnly: true
          example: '2026-01-03T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
          example: '2026-01-03T15:30:00Z'
        status:
          allOf:
          - $ref: '#/components/schemas/InviteStatusEnum'
          description: 'Computed status of the invitation code (read-only, calculated
            on read).

            - active: is_active=true AND not expired AND not exhausted

            - expired: is_active=true AND expires_at <= now

            - exhausted: is_active=true AND max_uses > 0 AND current_uses >= max_uses

            - revoked: is_active=false

            '
          readOnly: true
          example: active
    InviteCodeCreate:
      type: object
      required:
      - target_role
      properties:
        target_role:
          allOf:
          - $ref: '#/components/schemas/InviteRoleEnum'
          description: Role assigned to users who accept this invitation
          example: read/write
        max_uses:
          type: integer
          minimum: 0
          default: 0
          description: Maximum number of times this code can be used (0 = unlimited)
          example: 10
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiration timestamp (null = never expires)
          example: '2026-02-01T00:00:00Z'
    InviteCodeListResponse:
      type: object
      required:
      - invites
      - pagination
      properties:
        invites:
          type: array
          items:
            $ref: '#/components/schemas/InviteCode'
          description: List of invitation codes
        pagination:
          $ref: '#/components/schemas/Pagination'
    InviteJoinRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          minLength: 9
          maxLength: 9
          pattern: ^[A-Z0-9]{4}-[A-Z0-9]{4}$
          description: The invitation code to use
          example: GX82-K9LP
    InviteJoinResponse:
      type: object
      required:
      - organization_id
      - member_sub
      - role
      - joined_at
      properties:
        organization_id:
          type: string
          description: Organization ID that the user joined
          example: org_xxxxxxxxxx
        member_sub:
          type: string
          description: User sub of the member who joined
          example: auth0|xxxxxxxxxxxxxxx
        role:
          allOf:
          - $ref: '#/components/schemas/InviteRoleEnum'
          description: Role assigned to the new member
          example: read/write
        joined_at:
          type: string
          format: date-time
          description: Timestamp when the user joined
          example: '2026-01-03T16:00:00Z'
    InviteRoleEnum:
      type: string
      enum:
      - read
      - read/write
      - admin
      description: 'Role assigned to users who accept invitations.

        Note: This uses a dedicated enum that excludes `owner`. The `owner` role cannot
        be assigned via invitation codes for security reasons.

        '
      example: read/write
    InviteStatusEnum:
      type: string
      enum:
      - active
      - expired
      - exhausted
      - revoked
      description: Computed status of the invitation code
      example: active
    InviteScopeTypeEnum:
      type: string
      enum:
      - ORGANIZATION
      - TENANT
      description: 'Type of scope this invitation applies to.

        Tenant-scoped invitations are planned and will be released in a future update.

        '
      example: ORGANIZATION
    CardProperties:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
          minLength: 3
          maxLength: 64
          description: Descriptive name for the card.
        devices:
          type: array
          items:
            type: string
            pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          maxItems: 1000
          example:
          - device-001
          - device-002
          description: 'List of `device_id` values associated with the card (max 1000
            per request).

            Each device_id must be registered within the organization.

            Device IDs must contain only lowercase letters, numbers, or hyphens (-).
            Cannot start or end with a hyphen.

            '
        effective_at:
          type: string
          format: date-time
          nullable: true
          description: 'Effective time (when the card becomes active).

            Must be the current time or a future time.

            **⚠️Default: `UTC`**, recommended to use the format `2025-02-16T12:00:00+01:00`
            to ensure the correct time zone.

            About ISO 8601: https://en.wikipedia.org/wiki/ISO_8601

            '
        invalid_at:
          type: string
          format: date-time
          nullable: true
          description: 'Invalidation time (when the card becomes invalid/expires).

            Must be the current time or a future time.

            **⚠️Default: `UTC`**, recommended to use the format `2025-02-16T12:00:00+01:00`
            to ensure the correct time zone.

            About ISO 8601: https://en.wikipedia.org/wiki/ISO_8601

            '
        barcode_type:
          type: string
          nullable: true
          enum:
          - qrcode
          - aztec
          - pdf417
          - code128
          default: qrcode
          description: 'Barcode format for the card. Defaults to ''qrcode'' if not
            specified.

            Supported formats:

            - qrcode: QR Code (2D, widely supported)

            - aztec: Aztec Code (2D, compact for mobile ticketing)

            - pdf417: PDF417 (2D, common in boarding passes)

            - code128: Code 128 (1D barcode)

            '
        barcode_format:
          type: string
          nullable: true
          enum:
          - png
          - jpg
          - webp
          description: 'Preferred image format for the barcode URL.

            If not specified, format is auto-detected based on browser Accept header

            (WebP for modern browsers, PNG for older browsers).


            Supported formats:

            - png: PNG format (1-3KB, universal compatibility)

            - jpg: JPEG format (1-2KB, smallest file size)

            - webp: WebP format (0.8-2KB, best compression, modern browsers)


            Note: Users can override this by adding file extension to the URL

            (e.g., .jpg, .png, .webp, case-insensitive).

            '
          example: webp
    CardNumberSchema:
      type: string
      minLength: 8
      maxLength: 256
      pattern: ^[a-zA-Z0-9_-]+$
      description: Card No. (must be unique within your organization).
    Card:
      allOf:
      - $ref: '#/components/schemas/CardProperties'
      - type: object
        required:
        - id
        - organization_id
        - number
        properties:
          id:
            type: string
            readOnly: true
            description: Card ID (system-generated).
          organization_id:
            type: string
            readOnly: true
            description: Organization ID that owns this card (system-managed).
          number:
            $ref: '#/components/schemas/CardNumberSchema'
          created_at:
            type: string
            format: date-time
            readOnly: true
            description: Card creation timestamp (system-managed, UTC timezone).
          updated_at:
            type: string
            format: date-time
            readOnly: true
            description: Card last update timestamp (system-managed, UTC timezone).
          barcode_url:
            type: string
            readOnly: true
            nullable: true
            description: "URL to access the barcode/QR code image.\n\n**Format Selection**:\n\
              1. No extension (recommended): Auto-detects format via Accept header\n\
              \   - Modern browsers → WebP (0.8-2KB, smallest)\n   - Older browsers\
              \ → PNG (1-3KB, compatible)\n2. Explicit extension: .png, .jpg, .webp\
              \ (case-insensitive)\n\nThe type parameter in the URL matches the barcode_type\
              \ stored for this card.\nIf barcode_format is specified, the URL will\
              \ include the extension.\n"
            example: https://api.stayforge.net/g/barcode_img/generate/CARD123456?type=qrcode
    Pagination:
      type: object
      required:
      - page
      - limit
      - total
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          description: Current page number
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of items per page
          example: 20
        total:
          type: integer
          minimum: 0
          description: Total number of items
          example: 100
        total_pages:
          type: integer
          minimum: 0
          description: Total number of pages
          example: 5
        has_next:
          type: boolean
          description: Whether there is a next page
          example: true
        has_prev:
          type: boolean
          description: Whether there is a previous page
          example: false
        next_page_url:
          type: string
          nullable: true
          description: URL for the next page (includes page and limit as query parameters)
          example: /v1/cards/org_123?page=2&limit=20
        prev_page_url:
          type: string
          nullable: true
          description: URL for the previous page (includes page and limit as query
            parameters)
          example: /v1/cards/org_123?page=1&limit=20
        first_page_url:
          type: string
          description: URL for the first page (includes page=1 and limit as query
            parameters)
          example: /v1/cards/org_123?page=1&limit=20
        last_page_url:
          type: string
          description: URL for the last page (includes last page number and limit
            as query parameters)
          example: /v1/cards/org_123?page=5&limit=20
    CardListResponse:
      type: object
      required:
      - cards
      - pagination
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CardInput:
      allOf:
      - $ref: '#/components/schemas/CardProperties'
    CardUpdate:
      allOf:
      - $ref: '#/components/schemas/CardProperties'
    DeviceStatus:
      type: string
      enum:
      - active
      - paused
      description: 'Device status. Only devices with status "active" will be billed.

        - active: Device is active and will be billed

        - paused: Device is paused and will not be billed

        '
    Metadata:
      type: object
      nullable: true
      additionalProperties: true
      maxProperties: 64
      description: "Metadata as flexible key-value pairs supporting any JSON value\
        \ type.\n\nConstraints:\n- Keys must match pattern: ^[a-z][a-z0-9_]{0,31}$\
        \ (lowercase start, 1-32 chars, alphanumeric+underscore)\n- Maximum 64 key-value\
        \ pairs (maxProperties)\n- Maximum JSON depth: 4 levels\n- Maximum total size:\
        \ 4096 bytes (enforced at application layer)\n- All values must be valid JSON\n\
        \nExample:\n{\n  \"environment\": \"production\",\n  \"team\": \"backend\"\
        ,\n  \"config\": {\n    \"retry_count\": 3,\n    \"timeout_ms\": 5000\n  }\n\
        }\n"
    DeviceProperties:
      type: object
      properties:
        device_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          description: 'Device identifier (must be unique within the tenant).

            Must contain only lowercase letters, numbers, or hyphens (-). Cannot start
            or end with a hyphen.

            '
        sn:
          type: string
          nullable: true
          description: Serial number of the device.
        display_name:
          type: string
          nullable: true
          minLength: 3
          maxLength: 128
          description: Human-readable name for the device.
        price_id:
          type: string
          nullable: true
          pattern: ^[a-zA-Z0-9_-]+$
          description: Stripe price ID for billing purposes.
        status:
          $ref: '#/components/schemas/DeviceStatus'
        metadata:
          $ref: '#/components/schemas/Metadata'
        profile:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Device-specific profile configuration override.

            If set, overrides tenant-level and project-level defaults for this device.

            Set to null to clear and fall back to tenant/project defaults.

            '
    DeviceModelEnum:
      type: string
      enum:
      - VG-M350
      description: 'Available device models.

        Currently only VG-M350 is supported. More models will be added in the future.

        '
    Device:
      allOf:
      - $ref: '#/components/schemas/DeviceProperties'
      - type: object
        required:
        - id
        - tenant_id
        - model
        properties:
          id:
            type: string
            readOnly: true
            description: Unique device identifier (system-generated).
          tenant_id:
            type: string
            readOnly: true
            description: Tenant identifier that owns this device (system-managed).
          device_id:
            type: string
            nullable: true
            minLength: 1
            maxLength: 256
            pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
            description: 'Device identifier (must be unique within the tenant).

              Must contain only lowercase letters, numbers, or hyphens (-). Cannot
              start or end with a hyphen.

              Returns null if not set.

              '
          model:
            $ref: '#/components/schemas/DeviceModelEnum'
            readOnly: true
            description: 'Device model. This field is not stored in the database and
              is dynamically computed in API responses.

              Future: Will be determined by querying product database using serial
              number.

              '
          resolved_profile:
            type: object
            readOnly: true
            additionalProperties: true
            description: 'Effective profile configuration after applying three-level
              fallback logic:

              1. Device-specific profile (device.profile)

              2. Tenant model default (tenant.profiles[model])

              3. Default configuration managed by Stayforge


              Always present — returns HTTP 500 if no profile can be resolved at any
              level.

              This field is computed dynamically and cannot be set directly.

              '
          signed_config:
            type: string
            nullable: true
            readOnly: true
            description: 'Signed configuration string for VGuang device deployment.

              Format: ___VBAR_CONFIG_V1.1.0___{config_params}--{signature}


              This field is computed dynamically by calling the VGUANG-Tools microservice

              with the device''s resolved_profile. The microservice signs the configuration

              and returns a deployment-ready string.


              Cached for 4 minutes to optimize performance and reduce microservice
              load.

              Returns null if resolved_profile is not available or microservice fails.

              '
            example: ___VBAR_CONFIG_V1.1.0___{w_mode=1,ochannel=64,nochannel=64}--wgQKdybMgLYbhO1S1Sf1Vg==
          created_at:
            type: string
            format: date-time
            readOnly: true
            description: Device creation timestamp (system-managed, UTC timezone).
          updated_at:
            type: string
            format: date-time
            readOnly: true
            description: Device last update timestamp (system-managed, UTC timezone).
    DeviceListResponse:
      type: object
      required:
      - devices
      - pagination
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        pagination:
          $ref: '#/components/schemas/Pagination'
    DeviceInput:
      allOf:
      - $ref: '#/components/schemas/DeviceProperties'
      type: object
      required:
      - device_id
      - sn
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          description: 'Device identifier (must be unique within the tenant).

            Must contain only lowercase letters, numbers, or hyphens (-). Cannot start
            or end with a hyphen.

            This field is required when creating a device.

            '
        sn:
          type: string
          description: Serial number of the device. This field is required when creating
            a device.
    DeviceUpdate:
      allOf:
      - $ref: '#/components/schemas/DeviceProperties'
      - type: object
        properties:
          device_id:
            type: string
            minLength: 1
            maxLength: 256
            nullable: true
            pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
            description: 'Device identifier (must be unique within the tenant).

              Must contain only lowercase letters, numbers, or hyphens (-). Cannot
              start or end with a hyphen.

              '
          sn:
            type: string
            nullable: true
          display_name:
            type: string
            nullable: true
            minLength: 3
            maxLength: 128
          price_id:
            type: string
            nullable: true
            pattern: ^[a-zA-Z0-9_-]+$
          status:
            $ref: '#/components/schemas/DeviceStatus'
          metadata:
            $ref: '#/components/schemas/Metadata'
    DeviceInfo:
      type: object
      required:
      - sn
      - model_name
      properties:
        sn:
          type: string
          description: Device serial number
          example: SFVA78RABZ12345678
        model_name:
          type: string
          description: Device model name
          example: VG-M350
        production_date:
          type: string
          nullable: true
          description: Production date (YYYY-MM format)
          example: 2025-01
        warranty_expiry_date:
          type: string
          format: date
          nullable: true
          description: Warranty expiry date (ISO 8601 date format)
          example: '2027-01-31'
    DeviceSNOwner:
      type: object
      required:
      - sn
      - organization_id
      - device_id
      properties:
        sn:
          type: string
          description: Device serial number
          example: SFVA78RABZ12345678
        organization_id:
          type: string
          description: Organization that owns this device
          example: org_abc123
        device_id:
          type: string
          description: Device identifier within the organization
          example: dev_001
    APIKeyStatus:
      type: string
      enum:
      - active
      - suspended
      description: Status of the API key
    APIKeyUpdate:
      type: object
      properties:
        description:
          type: string
          minLength: 4
          maxLength: 128
          description: Name/description of the API key
          example: Production API Key
        permissions:
          type: array
          items:
            type: string
          maxItems: 50
          description: Allowed Permissions (scope:role format) for the API key (max
            50)
          example:
          - cards:read
          - cards:write
        allowed_ips:
          type: array
          items:
            type: string
          maxItems: 100
          description: Allowed IP ranges (CIDR) for this API key (max 100)
          example:
          - 0.0.0.0/0
          - 32.68.123.64/32
        allowed_tenants:
          type: array
          items:
            type: string
          maxItems: 100
          description: 'List of tenant IDs that this API key can access (max 100).

            If empty or null, the API key can access all tenants within the organization.

            If specified, the API key can only access the listed tenants.

            '
          example:
          - ten_xxxxxxxxxx
          - ten_yyyyyyyyyy
        status:
          $ref: '#/components/schemas/APIKeyStatus'
          description: Status of the API key
        tags:
          type: array
          items:
            type: string
          maxItems: 20
          description: Tags for the API key (max 20)
          example:
          - production
          - backend
        metadata:
          $ref: '#/components/schemas/Metadata'
    APIKeyInput:
      allOf:
      - $ref: '#/components/schemas/APIKeyUpdate'
      - type: object
        properties:
          ttl:
            type: integer
            nullable: true
            description: TTL of the API key in seconds. If not set, the default TTL
              is used.
            example: 3600
    APIKeyInDB:
      allOf:
      - $ref: '#/components/schemas/APIKeyInput'
      - type: object
        required:
        - apikey_id
        - organization_id
        - created_at
        - secret_masked
        - is_suspended
        properties:
          apikey_id:
            type: string
            readOnly: true
            description: Unique identifier for the API key (external ID, system-generated)
            example: a1b2c3d4e5f6
          organization_id:
            type: string
            readOnly: true
            description: Organization ID that owns this API key (system-managed)
            example: org_xxxxxxxxxx
          created_at:
            type: string
            format: date-time
            readOnly: true
            description: Creation timestamp (system-managed, UTC timezone)
          secret_masked:
            type: string
            description: Masked secret key (for display purposes)
            example: sk_live_abc***xyz
          is_suspended:
            type: boolean
            description: 'Whether the API key is suspended due to billing or policy
              reasons.

              Suspended API keys cannot be used but remain visible in the system.

              This is different from deletion - suspended keys can be reactivated.

              '
          suspension_reason:
            type: string
            nullable: true
            description: 'Reason why the API key is suspended (e.g. billing, policy_violation).

              This field is only set when the API key is suspended for billing or
              policy reasons,

              not when it is deleted by the user.

              '
    APIKeyList:
      allOf:
      - $ref: '#/components/schemas/APIKeyInDB'
      - type: object
        properties:
          expires_at:
            type: string
            format: date-time
            nullable: true
            description: 'Expiration time based on created_at and ttl.

              Returns null if ttl is null (key never expires).

              '
    APIKeyListResponse:
      type: object
      required:
      - apikeys
      - pagination
      properties:
        apikeys:
          type: array
          items:
            $ref: '#/components/schemas/APIKeyList'
        pagination:
          $ref: '#/components/schemas/Pagination'
    APIKeyCreate:
      allOf:
      - $ref: '#/components/schemas/APIKeyInDB'
      - type: object
        required:
        - secret_key
        properties:
          secret_key:
            type: string
            description: 'Secret key for the API key. Only returned on creation.

              This is the only time the full secret key will be available.

              Prefix: `sk_live_` for production.

              '
            example: sk_live_2ecWxzqNVMT4AMD7xFEfWSWC6fio9h...
    BillingAddress:
      type: object
      required:
      - line1
      properties:
        line1:
          type: string
          description: 'The first line of the street address, such as street name,
            house number, building name, etc.

            '
          example: 1-2-3 Shibuya
        line2:
          type: string
          nullable: true
          description: 'The second line of the address, optional, such as apartment
            number, suite number, floor, etc.

            '
          example: Apt 502
        city:
          type: string
          description: 'City/Region (City). Required in some countries and depends
            on the region.

            '
          example: Shibuya-ku
        state:
          type: string
          description: 'State/Province. May be required depending on the country.

            '
          example: Tokyo
        postal_code:
          type: string
          description: 'Zip / Postal Code.

            '
          example: '1500002'
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: 'ISO 3166-1 alpha-2 two-digit country code, for example: ''JP'',
            ''US''.

            '
          example: JP
        phone:
          type: string
          nullable: true
          description: Phone number.
          example: '+810123456789'
        email:
          type: string
          pattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$
          description: Email address.
          example: jane@example.com
        addressee_name:
          type: string
          nullable: true
          description: 'Addressee name - the name that appears on invoices.

            '
          example: Stayforge LLC
    UserInfo:
      type: object
      required:
      - sub
      properties:
        sub:
          type: string
          description: User identifier (subject) from Auth0
          example: google-oauth2|117899346661318779991
        given_name:
          type: string
          description: User's given name (first name)
          example: Junpei
        family_name:
          type: string
          description: User's family name (last name)
          example: Ikuta
        nickname:
          type: string
          description: User's nickname
          example: junpei
        name:
          type: string
          description: User's full name
          example: Junpei Ikuta
        picture:
          type: string
          format: uri
          description: URL to user's profile picture
          example: https://lh3.googleusercontent.com/a/ACg8ocJ4JC_WK8rNA9wcGoLvCxuPMEmZCSae2kc08O17YZAP2vSB0g=s96-c
        updated_at:
          type: string
          format: date-time
          description: Last update time of user information
          example: '2025-12-31T04:50:26.416Z'
        email:
          type: string
          format: email
          description: User's email address
          example: junpei@stayforge.co
        email_verified:
          type: boolean
          description: Whether the email address has been verified
          example: true
    TenantEnvironmentEnum:
      type: string
      enum:
      - development
      - staging
      - production
      description: Available environment types for tenants
      default: development
    TenantMembership:
      type: object
      required:
      - tenant_id
      - member_sub
      - role
      properties:
        tenant_id:
          type: string
          readOnly: true
          description: Tenant ID.
          example: ten_xxxxxxxxxx
        member_sub:
          type: string
          description: Member sub from auth0
          example: auth0|xxxxxxxxxxxxxxx
        role:
          $ref: '#/components/schemas/MemberRoleEnum'
          description: Role of the member.
          example: admin
        profile:
          $ref: '#/components/schemas/UserInfo'
          nullable: true
          description: Profile of the member. Only included when explicitly requested.
    TenantDeviceMetrics:
      type: object
      properties:
        total:
          type: integer
          description: Total number of devices
          example: 150
        online:
          type: integer
          nullable: true
          description: 'Number of online devices.

            **Note:** This field may be null if the logging system is not yet implemented.

            '
          example: 120
        unlocks_today:
          type: integer
          nullable: true
          description: 'Number of unlocks in the last 24 hours (from now).

            **Note:** This field may be null if the logging system is not yet implemented.

            '
          example: 450
    TenantCardMetrics:
      type: object
      properties:
        active:
          type: integer
          description: Number of active cards
          example: 500
        inactive:
          type: integer
          description: Number of inactive cards
          example: 50
        total:
          type: integer
          description: Total number of cards
          example: 550
    TenantRealtimeMetrics:
      type: object
      properties:
        devices:
          $ref: '#/components/schemas/TenantDeviceMetrics'
          description: Device-related metrics
        cards:
          $ref: '#/components/schemas/TenantCardMetrics'
          description: Card-related metrics
    TenantYesterdaySnapshot:
      type: object
      properties:
        devices:
          $ref: '#/components/schemas/TenantDeviceMetrics'
          nullable: true
          description: 'Device metrics snapshot at yesterday UTC 00:00.

            **Note:** This field may be null if the logging system is not yet implemented.

            '
        cards:
          $ref: '#/components/schemas/TenantCardMetrics'
          nullable: true
          description: 'Card metrics snapshot at yesterday UTC 00:00.

            **Note:** This field may be null if the logging system is not yet implemented.

            '
    TenantMetrics:
      type: object
      properties:
        realtime:
          $ref: '#/components/schemas/TenantRealtimeMetrics'
          description: 'Real-time metrics. These metrics are cached for 15 minutes
            to improve performance.

            '
        yesterday:
          $ref: '#/components/schemas/TenantYesterdaySnapshot'
          nullable: true
          description: 'Metrics snapshot from yesterday UTC 00:00.

            **Note:** This field may be null if the logging system is not yet implemented.

            '
    MyResources:
      type: object
      required:
      - organizations
      - tenants
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationDetail'
          description: List of organizations the current user belongs to
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantDetail'
          description: List of tenants the current user belongs to
    TenantInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 64
          description: Name of the tenant.
          example: Lobbyist Hotel
        description:
          type: string
          maxLength: 1024
          nullable: true
          description: Description of the tenant
          example: Could heart back forward can food support.
        environment:
          $ref: '#/components/schemas/TenantEnvironmentEnum'
          description: Environments of the tenant
          default: development
          example: development
    TenantUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 64
          description: Name of the tenant.
          example: Lobbyist Hotel
        description:
          type: string
          maxLength: 1024
          nullable: true
          description: Description of the tenant
          example: Could heart back forward can food support.
        environment:
          $ref: '#/components/schemas/TenantEnvironmentEnum'
          description: Environments of the tenant
          default: development
          example: development
        parent_organization:
          type: string
          nullable: true
          description: Parent organization ID
          example: org_69136e52ae56a37415f19365
    TenantMembershipCreate:
      type: object
      required:
      - member_sub
      - role
      properties:
        member_sub:
          type: string
          description: Member sub from auth0
          example: auth0|xxxxxxxxxxxxxxx
        role:
          $ref: '#/components/schemas/MemberRoleEnum'
          description: Role of the member.
          example: admin
      description: Request model for creating tenant membership
    TenantMembershipUpdate:
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/MemberRoleEnum'
          description: New role of the member.
          example: admin
      description: Request model for updating tenant membership
  parameters:
    ApiKeyHeader:
      name: X-API-Key
      in: header
      required: true
      description: "API Key for authentication. Get your API key from [dash.stayforge.io/settings/apikeys](https://dash.stayforge.io/settings/apikeys).\
        \ \nAPI keys must be prefixed with `sk_live_`.\n"
      schema:
        type: string
        example: sk_live_example_key_1234567890
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: "User's Access Token for authentication. \nInclude the token in\
        \ the Authorization header as: `Authorization: Bearer <token>`\nThis authentication\
        \ method is used for API Key management endpoints.\nUsers must have admin\
        \ or owner role in the organization to manage API keys.\n"
      schema:
        type: string
        pattern: ^Bearer .+
        example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
    OrganizationIdPath:
      name: organization_id
      in: path
      required: true
      description: Organization identifier
      schema:
        type: string
        pattern: ^org_[a-zA-Z0-9_-]+$
        example: org_4e7a2daebd497c2c
    CardNumberPath:
      name: card_number
      in: path
      required: true
      description: Card number identifier
      schema:
        $ref: '#/components/schemas/CardNumberSchema'
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      description: Tenant identifier
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[a-zA-Z0-9_-]+$
        example: ten_1234567890
    MemberSubPath:
      name: member_sub
      in: path
      required: true
      description: Member sub from auth0
      schema:
        type: string
        minLength: 1
        pattern: ^[a-zA-Z0-9|_-]+$
        example: auth0|xxxxxxxxxxxxxxx
    DeviceIdPath:
      name: device_id
      in: path
      required: true
      description: Device identifier
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
        example: device-001
    APIKeyIdPath:
      name: apikey_id
      in: path
      required: true
      description: API Key identifier
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[a-zA-Z0-9_-]+$
        example: a1b2c3d4e5f6
    InviteIdPath:
      name: invite_id
      in: path
      required: true
      description: Invitation identifier
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^inv_[a-zA-Z0-9]+$
        example: inv_abc123xyz
    InviteStatusQuery:
      name: status
      in: query
      required: false
      description: 'Filter by status: `active`, `expired`, `exhausted`, `revoked`,
        `all` (default: `active`)

        - active: is_active=true AND not expired AND not exhausted

        - expired: is_active=true AND expires_at <= now

        - exhausted: is_active=true AND max_uses > 0 AND current_uses >= max_uses

        - revoked: is_active=false

        - all: Return all invites regardless of status

        '
      schema:
        type: string
        enum:
        - active
        - expired
        - exhausted
        - revoked
        - all
        default: active
        example: active
    PageQuery:
      name: page
      in: query
      required: false
      description: 'Page number (starts from 1).

        If not provided, defaults to 1.

        Default: 1, Maximum: 1000000

        '
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000000
        default: 1
        example: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      description: 'Number of items per page (1-100).

        If not provided, defaults to 20.

        Default: 20, Maximum: 100

        '
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    CardNumberQuery:
      name: number
      in: query
      required: false
      description: 'Card No. (must be unique within your organization).

        If not provided, a unique card number will be automatically generated.

        Provide this only when you must set a specific card number; otherwise omit
        it to let the system generate one.

        '
      schema:
        $ref: '#/components/schemas/CardNumberSchema'
    ModelPath:
      name: model
      in: path
      required: true
      description: Device model name (e.g., VG-M350)
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        minLength: 1
        maxLength: 64
        example: VG-M350
