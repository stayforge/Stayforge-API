openapi: 3.0.3
info:
  title: Stayforge API
  version: v1.1.12
  description: "API for managing cards within organizations. \n\n---\n\nAny Question?\
    \ \n\n- [New issues](https://github.com/stayforge/Stayforge-API/issues).\n- [Documents](https://docs.stayforge.io/apis/stayforge-api/information)\n"
  contact:
    name: Stayforge Support
    email: support@stayforge.co
  license:
    name: Stayforge API Terms of Service
    url: https://docs.stayforge.io/apis/stayforge-api/terms
servers:
- url: https://api.stayforge.net
  description: Production server
tags:
- name: Cards
  description: Card management operations
- name: Devices
  description: Device management operations
- name: APIKeys
  description: API Key management operations (requires User's Access Token authentication)
- name: Organizations
  description: Organization management operations (requires User's Access Token authentication)
- name: Tenants
  description: Tenant management operations (requires User's Access Token authentication)
- name: Account
  description: Account-related operations (requires User's Access Token authentication)
- name: Invites
  description: Invitation code management operations (requires User's Access Token
    authentication)
paths:
  /v1/cards/{organization_id}:
    parameters:
    - $ref: '#/components/parameters/OrganizationIdPath'
    get:
      summary: List cards
      operationId: ListCards
      tags:
      - Cards
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - name: tenant_id
        in: query
        required: false
        description: 'Filter cards by tenant ID. Only cards that have at least one
          device belonging to this tenant will be returned.

          If not provided, all cards in the organization are returned.

          '
        schema:
          type: string
      responses:
        '200':
          description: List of cards with pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardListResponse'
        '400':
          description: 'Bad request - Invalid path parameter format, pagination parameters,
            or validation error.

            Error codes: `invalid_request`, `invalid_pagination`, `invalid_path_parameter`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_path_parameter:
                  value:
                    code: invalid_path_parameter
                    message: organization_id must match pattern ^org_[a-zA-Z0-9_-]+$
                invalid_pagination:
                  value:
                    code: invalid_pagination
                    message: page number must be at least 1
                invalid_request:
                  value:
                    code: invalid_request
                    message: Invalid request parameters
        '401':
          description: 'Unauthorized - Missing or invalid API key.

            Error codes: `authentication_required`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                authentication_required:
                  value:
                    code: authentication_required
                    message: 'authentication required: invalid or missing API key'
        '403':
          description: 'Forbidden - API key does not have required permissions or
            organization_id mismatches.

            Error codes: `insufficient_permissions`, `organization_id_mismatch`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_permissions:
                  value:
                    code: insufficient_permissions
                    message: API key does not have permission to access this resource
        '406':
          description: 'Not Acceptable - Both authentication methods (X-API-Key and
            Authorization Bearer token) are missing.

            Error codes: `not_acceptable`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_acceptable:
                  value:
                    code: not_acceptable
                    message: Both authentication methods are missing
    post:
      summary: Create a card
      operationId: CreateCard
      tags:
      - Cards
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/CardNumberQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardInput'
      responses:
        '201':
          description: Card created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: 'Bad request - Invalid request body or validation error.

            Error codes: `invalid_request`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    code: invalid_request
                    message: 'Invalid request body: validation failed'
        '401':
          description: 'Unauthorized - Missing or invalid API key.

            Error codes: `authentication_required`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                authentication_required:
                  value:
                    code: authentication_required
                    message: 'authentication required: invalid or missing API key'
        '403':
          description: 'Forbidden - API key does not have required permissions or
            organization_id mismatches.

            Error codes: `insufficient_permissions`, `organization_id_mismatch`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_permissions:
                  value:
                    code: insufficient_permissions
                    message: API key does not have permission to create cards
        '406':
          description: 'Not Acceptable - Both authentication methods (X-API-Key and
            Authorization Bearer token) are missing.

            Error codes: `not_acceptable`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_acceptable:
                  value:
                    code: not_acceptable
                    message: Both authentication methods are missing
        '409':
          description: 'Conflict - Card number already exists for this organization.

            Error codes: `duplicate_card_number`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicate_card_number:
                  value:
                    code: duplicate_card_number
                    message: Card number already exists for this organization
        '422':
          description: 'Unprocessable Entity - Request is well-formed but contains
            semantic errors.

            Error codes: `unprocessable_entity`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unprocessable_entity:
                  value:
                    code: unprocessable_entity
                    message: Device validation failed
        '500':
          description: 'Internal server error - Service or database error occurred.

            Error codes: `service_error`, `create_error`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                create_error:
                  value:
                    code: create_error
                    message: 'Failed to create card: failed to save card'
                service_error:
                  value:
                    code: service_error
                    message: Internal server error occurred
